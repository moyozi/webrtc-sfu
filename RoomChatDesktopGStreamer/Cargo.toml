[package]
name = "roomchat-desktop-gstreamer"
version = "0.1.0"
edition = "2021"
description = "RoomChat 桌面客户端 — Slint UI + GStreamer (webrtcbin / VP8 / Opus)"
license = "MIT"
publish = false

[lib]
name = "roomchat_desktop_gstreamer"
path = "src/lib.rs"

[[bin]]
name = "roomchat-desktop-gstreamer"
path = "src/main.rs"

# 无界面冒烟测试: 加入房间并把 UiEvent 打到 stdout, 用于 CI / 无显示环境验证
# WebRTC 发布与订阅链路 (可选, 不影响主程序)。
[[bin]]
name = "roomchat-gst-headless"
path = "src/bin/headless.rs"

[dependencies]
# UI
slint = "1.18.1"

# WebRTC 引擎 + 媒体采集/编解码 — 全部由 GStreamer 完成:
#   webrtcbin (ICE/DTLS/SRTP, 发布与订阅), autovideosrc/autoaudiosrc (采集),
#   vp8enc/opusenc (编码), decodebin (解码), appsink (投递 RGBA 帧给 UI)。
# 需要 GStreamer >= 1.28: webrtcbin 的 `add-transceiver` 在 1.28 改为
# `(direction, caps)`, 更早版本为 `(kind, direction)`。
gstreamer = { version = "0.25", features = ["v1_28"] }
gstreamer-webrtc = { version = "0.25", features = ["v1_28"] }
gstreamer-sdp = { version = "0.25", features = ["v1_28"] }
gstreamer-app = { version = "0.25", features = ["v1_28"] }
gstreamer-video = { version = "0.25", features = ["v1_28"] }

# 信令 (WebSocket 客户端)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

# 序列化 / 线程通信
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crossbeam-channel = "0.5.17"

# 日志
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
