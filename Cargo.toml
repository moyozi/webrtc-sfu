[package]
name = "webrtc-sfu"
version = "0.1.0"
edition = "2021"
description = "High-performance WebRTC SFU using str0m + nix recvmmsg polling"
license = "MIT"

[[bin]]
name = "sfu-server"
path = "src/main.rs"

[dependencies]
# WebRTC stack (Sans I/O, drives from event loop)
str0m = "0.21"

# Linux system call bindings
nix = { version = "0.29", features = ["net", "socket", "uio", "event", "fs", "process", "signal", "sched"] }
libc = "0.2"

# Zero-copy byte buffer
bytes = "1"

# Lock-free cross-thread channels (signaling → media workers)
crossbeam-channel = "0.5"

# Async runtime for signaling server only (media path is fully synchronous)
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"

# QUIC 信令 (连接迁移: 移动端 WiFi/蜂窝切换时信令连接不中断)
quinn = "0.11"
# 自签名证书生成 (开发/内网部署)
rcgen = "0.14"
# 证书指纹 (WebTransport serverCertificateHashes / 客户端固定校验)
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
parking_lot = "0.12"
ahash = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
