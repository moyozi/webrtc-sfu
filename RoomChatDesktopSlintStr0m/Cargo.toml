[package]
name = "roomchat-desktop-slint-str0m"
version = "0.1.0"
edition = "2021"
description = "RoomChat 桌面客户端 — Slint UI + str0m (纯 Rust WebRTC) + ffmpeg 采集/编解码"
license = "MIT"
publish = false

[[bin]]
name = "roomchat-desktop-slint-str0m"
path = "src/main.rs"

[dependencies]
# UI
slint = "1.18.1"

# WebRTC 引擎 — str0m 是 Sans-IO 的纯 Rust WebRTC 协议栈。
# 关闭默认 `examples` feature (会拉入 rouille/rustls), 只保留 aws-lc-rs 加密后端。
str0m = { version = "0.23.1", default-features = false, features = ["aws-lc-rs"] }

# 媒体采集 / 编解码 (libav*): 摄像头/麦克风采集、VP8/Opus 编解码、缩放与重采样。
# 需要系统安装 FFmpeg 开发库 (libavcodec/format/util/filter/device/scale/resample)。
ffmpeg-next = "9.0.0"

# 信令 (WebSocket 客户端)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

# 序列化 / 线程通信
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crossbeam-channel = "0.5.17"

# 日志
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
