# 针对不稳定网络: 放宽 cargo 的低速中断判定, 关闭 HTTP/2 多路复用
[http]
multiplexing = false
low-speed-limit = 0
timeout = 300

[net]
retry = 10

# reactor-webrtc 的 macOS 预编译 libwebrtc 以 13.0 为目标构建。
# rustc 默认部署目标 (11.0) 会导致链接缺少 ___isPlatformVersionAtLeast 符号,
# 这里与其对齐, 避免 `Undefined symbols` 链接错误。
[env]
MACOSX_DEPLOYMENT_TARGET = "13.0"
# 使用本地下载/解压好的 libwebrtc 预编译包, 跳过构建时自动下载
REACTOR_WEBRTC_LIB_DIR = "C:/Users/hongs/Downloads/reactor-webrtc-win-x64-release"
