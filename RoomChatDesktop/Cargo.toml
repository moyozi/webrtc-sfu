[package]
name = "roomchat-desktop"
version = "0.1.0"
edition = "2021"
description = "RoomChat 桌面客户端 — Slint UI + reactor-webrtc (libwebrtc)"
license = "MIT"
publish = false

[[bin]]
name = "roomchat-desktop"
path = "src/main.rs"

[dependencies]
# UI
slint = "1.18"

# WebRTC 引擎 (libwebrtc 安全封装, 构建时自动下载对应平台预编译库)
reactor-webrtc = "0.18"

# 摄像头采集 (AVFoundation / V4L2 / MSMF); 推帧给 reactor-webrtc 视频轨
nokhwa = { version = "0.10", features = ["input-native", "camera-sync-impl"] }

# 信令 (WebSocket 客户端)
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"

# 序列化 / 线程通信
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
