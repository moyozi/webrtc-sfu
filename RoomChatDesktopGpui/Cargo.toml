[package]
name = "roomchat-desktop-gpui"
version = "0.1.0"
edition = "2021"
description = "RoomChat 桌面客户端 (GPUI + gpui-kit) — 多平台 UI + reactor-webrtc (libwebrtc)"
license = "MIT"
publish = false

[[bin]]
name = "roomchat-desktop-gpui"
path = "src/main.rs"

[dependencies]
# UI: gpui-kit 一站式引入 GPUI (gpui-pre) + gpui-component 组件库 + 默认资源
#     根命名空间 `gpui_kit::*` 即 GPUI 自身, `gpui_kit::component::*` 为组件。
gpui-kit = "0.6.6"
# 直接用 GPUI 的 `#[derive(Render)]` 等过程宏: 宏展开会引用 `::gpui::...`,
# 所以这里把 gpui-kit 内部使用的同一个 gpui-pre 以 `gpui` 名字引入 (同一份, 不重复)。
gpui = { package = "gpui-pre", version = "=0.3.6" }
# 把 GPU 原始视频帧 (BGRA) 包装成 GPUI 的 RenderImage
image = "0.25"

# WebRTC 引擎 (libwebrtc 安全封装, 构建时自动下载对应平台预编译库)
reactor-webrtc = "0.18.0"

# 摄像头采集 (AVFoundation / V4L2 / MSMF); 推帧给 reactor-webrtc 视频轨
# 注意: 关闭默认 `decoding` feature, 它依赖的 mozjpeg 会导出与 libwebrtc 内置
# libjpeg 同名的 `jpeg_*` 符号, 静态链接时冲突; MJPEG 由纯 Rust 的 zune-jpeg 解码。
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native", "camera-sync-impl"] }
zune-jpeg = "0.5.15"

# 信令 (WebSocket 客户端)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

# 序列化 / 线程通信
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crossbeam-channel = "0.5.17"
# worker 线程 → GPUI 主线程的事件通道 (Receiver 可作为 Future 被 await)
async-channel = "2.5"

# 日志
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
